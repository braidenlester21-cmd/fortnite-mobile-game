<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 Drag & Drop To-Do List</h1>
        
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..."
                class="task-input"
            >
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>

        <div class="board">
            <!-- TODO Column -->
            <div class="column">
                <h2>📋 To Do</h2>
                <div class="droppable" id="todo-column" data-status="todo">
                    <!-- Tasks will be added here -->
                </div>
            </div>

            <!-- IN PROGRESS Column -->
            <div class="column">
                <h2>⏳ In Progress</h2>
                <div class="droppable" id="progress-column" data-status="progress">
                    <!-- Tasks will be added here -->
                </div>
            </div>

            <!-- DONE Column -->
            <div class="column">
                <h2>✅ Done</h2>
                <div class="droppable" id="done-column" data-status="done">
                    <!-- Tasks will be added here -->
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="clearBtn" class="clear-btn">Clear All</button>
            <button id="exportBtn" class="export-btn">Export Tasks</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
